name: jacral-backend
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core web framework
      - fastapi==0.115.0
      - uvicorn[standard]==0.30.6

      # Database
      - sqlalchemy==2.0.35
      - psycopg[binary]==3.2.3
      - alembic==1.13.3

      # Validation / Settings
      - pydantic[email]==2.9.2
      - pydantic-settings==2.5.2
      - python-dotenv==1.0.1
      - python-multipart==0.0.12

      # Authentication & Rate Limiting
      - python-jose[cryptography]==3.3.0
      - bcrypt==4.2.0
      - passlib[bcrypt]==1.7.4
      - slowapi==0.1.9
      - pyotp==2.9.0
      - qrcode==7.4.2

      # Email
      - aiosmtplib==3.0.2

      # HTTP client (for payment gateway, Shiprocket)
      - httpx==0.27.2

      # Testing
      - pytest==8.3.3
      - pytest-asyncio==0.24.0

      # Utilities
      - python-slugify==8.0.4
